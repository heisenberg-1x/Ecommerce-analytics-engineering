version: 2

models:
  - name: dim_customer
    description: "Customer dimension table containing unique customer details"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        tests:
          - unique
          - not_null

  - name: dim_product
    description: "Product dimension table containing unique product details"
    columns:
      - name: product_id
        description: "Unique identifier for each product"
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Date dimension table containing unique date details"
    columns:
      - name: date_id
        description: "Unique identifier for each date"
        tests:
          - unique
          - not_null

  - name: fact_sales
    description: "Fact table containing one row per order item for delivered orders"
    columns:
      - name: order_id
        description: "Unique identifier for each order"
        tests:
          - not_null
      - name: order_item_id
        description: "Unique identifier for each order item"
        tests:
          - not_null
      - name: product_id
        description: "Unique identifier for each product"
      - name: customer_id
        description: "Unique identifier for each customer"
      - name: date_id
        description: "Unique identifier for each date"
      - name: price
        description: "Item price excluding freight"
        tests:
          - not_null
      - name: total_amount
        description: "Total amount including price and freight value"
      - name: order_status
        description: "Status of the order - only delivered orders included"
        tests:
          - accepted_values:
              values: ['delivered']
      - name: freight_value
        description: "Freight cost for the order item"
      - name: payment_type
        description: "Primary payment method used for the order"
      - name: payment_installments
        description: "Number of installments used for payment"